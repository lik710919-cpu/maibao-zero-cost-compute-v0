name: Zero Cash Cost External Compute V3 Two Provider

on:
  push:
    branches:
      - experiment/zero-cost-compute-v3-wandbox
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  V3_N: "200000"
  V3_CHUNKS: "2"
  WANDBOX_COMPILER: "cpython-3.13.8"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run full unit suite
        run: python -m unittest discover -s experiments/zero_cost_compute_v0/tests -v

  github-shard:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compute shard 0 on GitHub hosted provider
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: >-
          python experiments/zero_cost_compute_v0/compute_chunk.py
          --n "$V3_N" --chunks "$V3_CHUNKS" --index 0
          --output out/result-0.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3-github-result
          path: out/result-0.json
          if-no-files-found: error

  wandbox-shard:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Submit shard 1 to Wandbox remote provider
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: >-
          python experiments/zero_cost_compute_v0/wandbox_chunk.py
          --n "$V3_N" --chunks "$V3_CHUNKS" --index 1
          --compiler "$WANDBOX_COMPILER" --output out/result-1.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3-wandbox-result
          path: out/result-1.json
          if-no-files-found: error

  aggregate:
    needs: [github-shard, wandbox-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v3-*-result
          path: results
          merge-multiple: true
      - name: Verify same task across both providers
        run: >-
          python experiments/zero_cost_compute_v0/aggregate_results.py
          --results-dir results --output-dir evidence
          --expected-n "$V3_N" --expected-chunks "$V3_CHUNKS"
      - name: Build provider catalog from real V3 evidence
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: >-
          python experiments/zero_cost_compute_v0/provider_probe.py
          --output evidence/provider-catalog.json
          --wandbox-result results/result-1.json
      - uses: actions/upload-artifact@v4
        with:
          name: zero-cost-compute-v3-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 30
