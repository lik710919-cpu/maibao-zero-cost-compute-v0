<!doctype html>
<meta charset="utf-8">
<title>MaiBao Local MCP Repair Probe</title>
<pre id="out">BOOT</pre>
<script>
const out=document.getElementById('out');
const pending=new Map();
let endpoint='';
function show(x){ out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2); }
function send(id,method,params){
  return new Promise(async (resolve,reject)=>{
    pending.set(id,resolve);
    try{
      const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id,method,params})});
      if(!r.ok){pending.delete(id);reject(new Error('POST '+r.status));}
    }catch(e){pending.delete(id);reject(e);}
  });
}
const es=new EventSource('http://127.0.0.1:3120/sse');
es.addEventListener('endpoint',async e=>{
  try{
    endpoint=new URL(e.data,'http://127.0.0.1:3120').href;
    const init=await send(1,'initialize',{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'maibao-local-repair-probe',version:'1.0'}});
    await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized',params:{}})});
    const tools=await send(2,'tools/list',{});
    const status=await send(3,'tools/call',{name:'gateway_status',arguments:{}});
    show({endpoint,initialize:init,tool_names:(tools.result?.tools||[]).map(x=>x.name),gateway_status:status});
    es.close();
  }catch(err){show('ERROR '+String(err));}
});
es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){pending.get(m.id)(m);pending.delete(m.id);}}catch{}};
es.onerror=()=>{if(out.textContent==='BOOT')show('SSE_ERROR');};
</script>
